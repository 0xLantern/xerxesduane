<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow, noarchive, nosnippet, noimageindex">
<meta name="referrer" content="no-referrer">
<title>Private briefing</title>
<!--
  A password page on ministry.xerxesduane.com. It holds no content itself: the
  briefing and its PDFs are in join/brief.dat, encrypted (PBKDF2-SHA256 600k ->
  AES-256-GCM) by a script kept outside this public repository. The password
  never leaves the visitor's browser; a wrong one simply fails to decrypt.
-->
<style>
  @font-face { font-family: Fraunces; src: url(/fonts/fraunces-500.woff2) format("woff2"); font-weight: 500; font-display: swap; }
  @font-face { font-family: Inter; src: url(/fonts/inter-400.woff2) format("woff2"); font-weight: 400; font-display: swap; }
  @font-face { font-family: Inter; src: url(/fonts/inter-600.woff2) format("woff2"); font-weight: 600; font-display: swap; }
  :root { --canvas: #f7f3ec; --card: #fffdf9; --ink: #1c2a44; --body: #4a5468; --muted: #7a8296; --line: #e6dfd2; --accent: #b8862b; --err: #a33a2c; }
  @media (prefers-color-scheme: dark) {
    :root { --canvas: #12161f; --card: #1a202c; --ink: #f1ece2; --body: #c4c8d2; --muted: #8e95a5; --line: #2b3342; --accent: #e0b25a; --err: #f08a7a; }
  }
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body { margin: 0; background: var(--canvas); color: var(--body); font: 16px/1.65 Inter, system-ui, -apple-system, "Segoe UI", sans-serif; }
  main { max-width: 760px; margin: 0 auto; padding: 48px 20px 80px; }
  h1, h2 { font-family: Fraunces, Georgia, serif; font-weight: 500; color: var(--ink); line-height: 1.15; }
  h1 { font-size: clamp(40px, 8vw, 60px); margin: 6px 0 14px; letter-spacing: -.5px; }
  h2 { font-size: 26px; margin: 0 0 12px; }
  b { color: var(--ink); font-weight: 600; }
  section { margin-top: 44px; padding-top: 28px; border-top: 1px solid var(--line); }
  .eyebrow { font-size: 13px; letter-spacing: .08em; text-transform: uppercase; color: var(--accent); margin: 0; font-weight: 600; }
  .lede { font-size: 20px; color: var(--ink); max-width: 36em; }
  .note { font-size: 14px; color: var(--muted); }
  ul { padding-left: 1.2em; } li { margin: 0 0 10px; }
  .stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; margin: 6px 0 22px; }
  .stats div { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 14px; }
  .stats b { display: block; font-family: Fraunces, Georgia, serif; font-size: 30px; font-weight: 500; line-height: 1.1; }
  .stats span { font-size: 13px; line-height: 1.4; color: var(--muted); }
  .shots { display: grid; grid-template-columns: repeat(3, 1fr); gap: 18px 14px; }
  .shots figure { margin: 0; }
  .shots img { width: 100%; display: block; border-radius: 18px; border: 4px solid #111; aspect-ratio: 1/2; object-fit: cover; }
  .shots figcaption { font-size: 13px; line-height: 1.4; color: var(--muted); margin-top: 8px; }
  .shots figcaption b { display: block; font-size: 14px; }
  .join { background: var(--card); border: 1px solid var(--line); border-radius: 18px; padding: 26px 24px 12px; }
  .files { display: grid; gap: 12px; }
  .files a { display: flex; align-items: center; gap: 14px; background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 16px 18px; text-decoration: none; color: inherit; }
  .files a:hover, .files a:focus-visible { border-color: var(--accent); }
  .files .ic { flex: none; width: 40px; height: 48px; border-radius: 6px; background: var(--accent); color: #fff; display: grid; place-items: center; font: 600 11px Inter, sans-serif; }
  .files b { display: block; }
  .files span { font-size: 14px; color: var(--muted); }
  .foot { margin-top: 48px; font-size: 13px; color: var(--muted); }

  /* The lock screen */
  .gate { min-height: 100vh; display: grid; place-items: center; padding: 24px 20px; }
  .gate form { width: 100%; max-width: 380px; background: var(--card); border: 1px solid var(--line); border-radius: 20px; padding: 30px 26px; }
  .gate h1 { font-size: 30px; margin: 0 0 6px; }
  .gate p { margin: 0 0 20px; font-size: 15px; }
  .gate label { display: block; font-size: 14px; font-weight: 600; color: var(--ink); margin-bottom: 6px; }
  .gate input { width: 100%; font: inherit; font-size: 17px; padding: 12px 14px; border-radius: 12px; border: 1px solid var(--line); background: var(--canvas); color: var(--ink); }
  .gate input:focus { outline: 2px solid var(--accent); outline-offset: 1px; }
  .gate button { margin-top: 14px; width: 100%; font: 600 16px Inter, sans-serif; padding: 13px; border: 0; border-radius: 12px; background: var(--ink); color: var(--canvas); cursor: pointer; }
  .gate button:disabled { opacity: .6; cursor: progress; }
  .gate .msg { min-height: 1.4em; margin: 12px 0 0; font-size: 14px; color: var(--err); }
  [hidden] { display: none !important; }
  @media (max-width: 620px) {
    main { padding-top: 32px; }
    .stats { grid-template-columns: repeat(2, 1fr); }
    .shots { grid-template-columns: repeat(2, 1fr); }
    .join { padding: 22px 18px 8px; }
  }
</style>
</head>
<body>
<div class="gate" data-gate>
  <form data-form autocomplete="off">
    <h1>Private briefing</h1>
    <p>This page is for people we have invited. Enter the password you were given.</p>
    <label for="pw">Password</label>
    <input id="pw" name="pw" type="password" autocomplete="off" autocapitalize="none" spellcheck="false" required>
    <button type="submit">Open</button>
    <p class="msg" role="alert" data-msg></p>
  </form>
</div>
<main data-main hidden>
  <article data-content></article>
  <p class="foot">Please don't forward this link or its password, or share anything from it online. To protect the people we serve, please don't mention our name in public.</p>
</main>
<script>
(() => {
  const form = document.querySelector("[data-form]");
  const msg = document.querySelector("[data-msg]");
  const btn = form.querySelector("button");
  let sealed = null;
  const load = () => (sealed ??= fetch("/join/brief.dat", { cache: "no-store" }).then((r) => {
    if (!r.ok) throw new Error("fetch");
    return r.arrayBuffer();
  }));
  load().catch(() => {});

  async function open(password, buf) {
    const b = new Uint8Array(buf);
    if (new TextDecoder().decode(b.slice(0, 4)) !== "WMK1") throw new Error("format");
    const base = await crypto.subtle.importKey("raw", new TextEncoder().encode(password), "PBKDF2", false, ["deriveKey"]);
    const key = await crypto.subtle.deriveKey({ name: "PBKDF2", salt: b.slice(4, 20), iterations: 600000, hash: "SHA-256" }, base, { name: "AES-GCM", length: 256 }, false, ["decrypt"]);
    const plain = await crypto.subtle.decrypt({ name: "AES-GCM", iv: b.slice(20, 32) }, key, b.slice(32));
    return JSON.parse(new TextDecoder().decode(plain));
  }

  function show(data) {
    document.querySelector("[data-content]").innerHTML = data.html;
    const list = document.querySelector("[data-files]");
    for (const f of data.files) {
      const bytes = Uint8Array.from(atob(f.data), (c) => c.charCodeAt(0));
      const a = document.createElement("a");
      a.href = URL.createObjectURL(new Blob([bytes], { type: "application/pdf" }));
      a.download = f.name;
      a.innerHTML = '<span class="ic">PDF</span><span><b></b><span></span></span>';
      a.querySelector("b").textContent = f.title;
      a.querySelector("b + span").textContent = f.sub;
      list.append(a);
    }
    document.querySelector("[data-gate]").hidden = true;
    document.querySelector("[data-main]").hidden = false;
    document.title = "Waymark · Private briefing";
    window.scrollTo(0, 0);
  }

  form.addEventListener("submit", async (e) => {
    e.preventDefault();
    const pw = form.pw.value.trim();
    if (!pw) return;
    btn.disabled = true; msg.textContent = ""; btn.textContent = "Opening…";
    try {
      const buf = await load();
      let data;
      try { data = await open(pw, buf); } catch { throw new Error("password"); }
      show(data);
    } catch (err) {
      if (err.message !== "password") sealed = null;
      msg.textContent = err.message === "password" ? "That password didn't work. Please check it and try again." : "The page couldn't load. Please check your connection and try again.";
      form.pw.select();
    } finally {
      btn.disabled = false; btn.textContent = "Open";
    }
  });
})();
</script>
</body>
</html>
