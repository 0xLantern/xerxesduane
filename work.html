<!doctype html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <!-- A private tool: never indexed, never shown in previews. The response
         header says the same (vercel.json); this covers a copy saved to disk. -->
    <meta name="robots" content="noindex, nofollow, noarchive" />
    <meta name="referrer" content="no-referrer" />
    <meta name="theme-color" content="#f5f3ec" />
    <link rel="icon" type="image/svg+xml" href="/brand/icon/icon.svg" />
    <link rel="apple-touch-icon" href="/brand/favicon/icon-180.png" />
    <link rel="preload" href="/fonts/plus-jakarta-sans-var.woff2" as="font" type="font/woff2" crossorigin />
    <title>Work log · Xerxes Duane</title>
    <script>
      (function () {
        try {
          var saved = localStorage.getItem("xd-theme");
          if (saved === "dark") {
            document.documentElement.dataset.theme = "dark";
            var m = document.querySelector('meta[name="theme-color"]');
            if (m) m.setAttribute("content", "#0c1526");
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body class="bg-canvas text-fg antialiased">
    <div id="work-root"></div>
    <script type="module" src="/src/work/main.tsx"></script>
  </body>
</html>
