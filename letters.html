<!doctype html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <!-- Private letters: never indexed, never shown in link previews, never
         leaking the link (and its key) to another site through a referrer. -->
    <meta name="robots" content="noindex, nofollow, noarchive" />
    <meta name="referrer" content="no-referrer" />
    <meta name="theme-color" content="#f6f3ee" />
    <link rel="icon" type="image/svg+xml" href="/brand/icon/icon.svg" />
    <link rel="preload" href="/fonts/plus-jakarta-sans-var.woff2" as="font" type="font/woff2" crossorigin />
    <title>A letter from Xerxes Duane</title>
  </head>
  <body class="antialiased" style="background:#f6f3ee">
    <div id="letters-root"></div>
    <script type="module" src="/src/letters/main.tsx"></script>
  </body>
</html>
